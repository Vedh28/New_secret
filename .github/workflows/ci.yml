name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit + integrity (SQLite) tests
        run: pytest -m "not integration and not integration_pg and not integration_neo4j and not integration_full" -q

  backend-integration-pg:
    name: Backend PostgreSQL integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secret
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secret -d secret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_ENV: dev
      DATABASE_URL: postgresql+asyncpg://secret:secret@localhost:5432/secret
      NEO4J_URI: bolt://localhost:9999  # intentionally unreachable: Neo4j jobs are separate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: PostgreSQL integrity tests
        run: pytest -m "integration_pg or integration_full" -q

  backend-integration-neo4j:
    name: Backend Neo4j integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/secret
        ports:
          - 7687:7687
    env:
      SECRET_ENV: dev
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: secret
      DATABASE_URL: postgresql+asyncpg://secret:secret@localhost:5432/secret  # unreachable PG: separate from PG job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Neo4j integration tests
        run: pytest -m "integration_neo4j" -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.electron.json --noEmit
      - name: Build
        run: npm run build:web